; C2 pin storage (MongoDB + c2_backend). Starts on boot like the other TMMS programs.
;
; Its own file and NOT in [group:quadruped] on purpose: adding a program to that group makes
; `supervisorctl update` restart the whole group, ROS (tmms_ws) included. On its own, adding or
; removing C2 never touches anything else. Control it as `tmms_c2`, not `quadruped:tmms_c2`.
;
; Install on PC5:
;   sudo ln -s /home/unitree/.htxgrrt/bin/tmms_c2/tmms_c2_supervisor.conf /etc/supervisor/conf.d/tmms_c2_supervisor.conf
;   sudo supervisorctl reread && sudo supervisorctl update

[program:tmms_c2]
command=/bin/bash -c "docker compose -f /home/unitree/.htxgrrt/bin/tmms_c2/tmms_c2-compose.yaml up"
environment=HOME="/home/unitree"
autostart=true
autorestart=true
; Stop the whole process tree, so stopping tmms_c2 really stops the containers.
stopasgroup=true
killasgroup=true
stopsignal=SIGTERM
stopwaitsecs=20
user=unitree
redirect_stderr=true
stdout_logfile=/home/unitree/.htxgrrt/logs/tmms_c2.log
