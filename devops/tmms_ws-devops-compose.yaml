services:
  tmms_build:
    image: tmms_image:0.1.3
    platform: linux/arm64
    container_name: tmms_build
    # Enable all port forwarding
    network_mode: host
    privileged: true
    # Mount workspace for building and accessing install/
    # Keep interactive shell for manual builds
    stdin_open: true
    tty: true
    devices:
      - /dev:/dev
    volumes:
      # Requires: export TMMS_WS_PATH=/abs/path/to/tmms_ws
      - ${TMMS_WS_PATH:?set TMMS_WS_PATH to the absolute path of your tmms_ws checkout, e.g. export TMMS_WS_PATH=/abs/path/to/tmms_ws}:/home/htxgrrt/.htxgrrt/bin/tmms_ws
