# map_downsampler config: voxel-downsamples a saved .pcd for streaming to Lichtblick over
# rosbridge, as 3D context during navigation:
#
#   ~/load_pcd <name>     -> /downsampled_pcd_map
#
# The live map during mapping is published by FAST-LIO itself (/downsampled_fastlio_map).
#
# Launch with:  ros2 launch tmms_master operation.launch.py
# (the node runs for the whole session, so its load service is reachable whenever
# localization_manager loads a map.)
#
# NOTE: every float MUST be written with an explicit decimal point, or the ROS 2 yaml
# parameter parser infers int and throws InvalidParameterTypeException.
/**:
    ros__parameters:
        # ~/load_pcd reads <maps_dir>/pcd/<name>.pcd and publishes it here. maps_dir is the
        # ROOT of the map store -- operation.launch.py overrides it with the container path;
        # the node's own default is ~/.htxgrrt/maps.
        pcd_output_topic: "/downsampled_pcd_map"

        # A .pcd carries no frame. A loaded map is stamped with this, and must match whatever
        # the 2D map it accompanies is anchored to.
        pcd_frame_id: "map"

        # Metres, applied to all three axes. Rough guide for a typical indoor space, at the
        # 32 B/pt of the output:
        #   0.3  ->  ~150-300k pts   2.4-4.8 MB   more detail, still multi-MB on a big site
        #   0.5  ->   ~50-100k pts   1.6-3.2 MB   rooms/corridors clearly legible
        #   1.0  ->    ~15-25k pts   0.5-0.8 MB   coverage-only, features not legible
        #
        # Do NOT set this very small. PCL's VoxelGrid does not error when the leaf is too
        # small for the map's extent -- voxel_grid.hpp:248-258 warns and then passes the
        # cloud through COMPLETELY UNFILTERED. map_downsampler_node checks for this up front
        # and refuses to publish, so if the topic stays empty, check its log for the minimum
        # safe leaf size.
        leaf_size: 0.1
